<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Your Password</title>
    <link rel="icon" href="../assets/images/logo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="../cssPages/login.css">
    <style>
        .set-status { min-height: 18px; margin: -8px 0 16px; font-size: 13px; text-align: center; color: #ff9b8a; }
        .set-status.is-ok { color: #6fcf86; }
        .login-card .set-email { color: #ffffff; font-weight: 700; }
        .set-step[hidden] { display: none; }
        .set-link { display: flex; justify-content: center; text-decoration: none; padding: 16px 0; border-radius: 16px;
            background: linear-gradient(90deg, #1d7f3f 0%, #0f9a4e 100%); color: #ffffff; font-size: 17px; font-weight: 700; }
    </style>
</head>
<body>

<!-- Opened from the "You've been added as a PeakPath admin" email
     (addAdmin in functions/index.js). The link carries Firebase's
     password-reset code as ?oobCode=, checked and used here with
     verifyPasswordResetCode / confirmPasswordReset, so the new admin never
     sees Firebase's default firebaseapp.com page. -->
<div class="container">
    <div class="logo">
        <img src="../assets/images/logo.png" alt="PeakPath Logo">
        <div>
            <h1>Peak<span>Path</span></h1>
            <p>Hike Smart. Stay Safe. Explore More.</p>
        </div>
    </div>

    <div class="right-panel">
        <div class="login-card">
            <i class="fa-solid fa-key shield"></i>

            <!-- Checking the link -->
            <div class="set-step" data-step="loading">
                <h1>Set Your Password</h1>
                <p>Checking your link…</p>
            </div>

            <!-- Choose a password -->
            <form class="set-step" data-step="form" id="setForm" novalidate hidden>
                <h1>Set Your Password</h1>
                <p>for <span class="set-email" id="setEmail"></span></p>

                <div class="card-divider">
                    <span></span>
                    <i class="fa-solid fa-mountain divider-icon"></i>
                    <span></span>
                </div>

                <label for="newPassword">New Password</label>
                <div class="input-box password-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="newPassword" placeholder="At least 8 characters" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="newPassword" aria-label="Show password" title="Show password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <label for="confirmPassword">Confirm New Password</label>
                <div class="input-box password-box">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="confirmPassword" placeholder="Type the password again" autocomplete="new-password">
                    <button type="button" class="password-toggle" data-target="confirmPassword" aria-label="Show password" title="Show password">
                        <i class="fa-regular fa-eye"></i>
                    </button>
                </div>

                <p class="set-status" id="setStatus" role="status"></p>
                <button type="submit" id="setSubmit">Save Password</button>
            </form>

            <!-- Saved, or the link no longer works -->
            <div class="set-step" data-step="done" hidden>
                <h1 id="doneTitle">Password saved</h1>
                <p id="doneText">You can now sign in to the PeakPath Admin Portal with your email and new password.</p>
                <a class="set-link" href="Home.html">Go to Sign In</a>
            </div>
        </div>
    </div>
</div>

<script type="module">
    import { auth } from '../jsPages/firebase-config.js';
    import { confirmPasswordReset, verifyPasswordResetCode } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';

    // Same minimum as Settings > Change Password and Forgot Password.
    const PASSWORD_MIN_LENGTH = 8;
    const oobCode = new URLSearchParams(location.search).get('oobCode');
    const form = document.getElementById('setForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const submit = document.getElementById('setSubmit');
    const status = document.getElementById('setStatus');

    const show = (step) => document.querySelectorAll('.set-step').forEach((el) => { el.hidden = el.dataset.step !== step; });
    const say = (text, tone = '') => { status.textContent = text; status.className = `set-status${tone ? ` is-${tone}` : ''}`; };
    const linkDead = () => {
        document.getElementById('doneTitle').textContent = 'This link no longer works';
        document.getElementById('doneText').textContent =
            'It has expired (links work for 1 hour) or was already used. On the sign-in page, use Forgot Password with your email to get a code instead.';
        show('done');
    };

    document.querySelectorAll('.password-toggle').forEach((toggle) => {
        toggle.addEventListener('click', () => {
            const input = document.getElementById(toggle.dataset.target);
            const showing = input.type === 'text';
            input.type = showing ? 'password' : 'text';
            toggle.querySelector('i').className = showing ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
            toggle.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
            toggle.title = toggle.getAttribute('aria-label');
        });
    });

    if (!oobCode) {
        linkDead();
    } else {
        try {
            document.getElementById('setEmail').textContent = await verifyPasswordResetCode(auth, oobCode);
            show('form');
            newPassword.focus();
        } catch (error) {
            console.error('The password link was refused:', error);
            linkDead();
        }
    }

    form.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (newPassword.value.length < PASSWORD_MIN_LENGTH) {
            say(`The password must be at least ${PASSWORD_MIN_LENGTH} characters.`, 'error');
            newPassword.focus();
            return;
        }
        if (newPassword.value !== confirmPassword.value) {
            say('The two passwords do not match.', 'error');
            confirmPassword.focus();
            return;
        }
        submit.disabled = true;
        submit.textContent = 'Saving…';
        say('');
        try {
            await confirmPasswordReset(auth, oobCode, newPassword.value);
            show('done');
        } catch (error) {
            console.error('Saving the password failed:', error);
            if (error?.code === 'auth/expired-action-code' || error?.code === 'auth/invalid-action-code') {
                linkDead();
                return;
            }
            say(error?.code === 'auth/weak-password'
                ? 'That password is too weak. Try a longer one.'
                : error?.code === 'auth/network-request-failed'
                    ? 'Network error. Check your connection and try again.'
                    : `Could not save the password. Try again.${error?.code ? ` (${error.code})` : ''}`, 'error');
            submit.disabled = false;
            submit.textContent = 'Save Password';
        }
    });
</script>
</body>
</html>
